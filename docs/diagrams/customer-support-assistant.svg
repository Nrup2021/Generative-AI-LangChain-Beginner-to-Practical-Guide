<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">AI Customer Support Assistant architecture</title>
  <desc id="desc">A customer interacts with a support app, which sends requests to a Flask API and uses an intent classifier, policy documents, and order data to produce a support response.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f6fed"/>
    </marker>
    <style>
      .box { fill: #eef4ff; stroke: #2f6fed; stroke-width: 2; rx: 16; ry: 16; }
      .db { fill: #eafaf1; stroke: #1b9e5a; stroke-width: 2; }
      .llm { fill: #fff3e8; stroke: #f59e0b; stroke-width: 2; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #2f6fed; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="30" y="150" width="150" height="90" class="box"/>
  <text x="105" y="200" text-anchor="middle" class="label">Customer</text>

  <rect x="220" y="150" width="170" height="90" class="box"/>
  <text x="305" y="200" text-anchor="middle" class="label">Support App</text>

  <rect x="430" y="150" width="170" height="90" class="box"/>
  <text x="515" y="200" text-anchor="middle" class="label">Flask API</text>

  <rect x="650" y="150" width="180" height="90" class="box"/>
  <text x="740" y="200" text-anchor="middle" class="label">Intent Classifier</text>

  <rect x="650" y="285" width="200" height="90" class="db"/>
  <text x="750" y="330" text-anchor="middle" class="label">Order DB / CRM</text>

  <rect x="890" y="150" width="180" height="90" class="db"/>
  <text x="980" y="200" text-anchor="middle" class="label">Policy Vector Store</text>

  <rect x="830" y="285" width="180" height="90" class="llm"/>
  <text x="920" y="330" text-anchor="middle" class="label">LLM Agent</text>

  <rect x="270" y="50" width="220" height="80" class="box"/>
  <text x="380" y="95" text-anchor="middle" class="label">Support Response</text>

  <path d="M180 195 H220" class="arrow"/>
  <path d="M390 195 H430" class="arrow"/>
  <path d="M600 195 H650" class="arrow"/>
  <path d="M740 240 V285" class="arrow"/>
  <path d="M830 195 H890" class="arrow"/>
  <path d="M750 375 H870 V335" class="arrow"/>
  <path d="M980 240 V285" class="arrow"/>
  <path d="M890 330 H850" class="arrow"/>
  <path d="M490 150 V120 H380 V130" class="arrow"/>
  <path d="M270 90 H180 V140" class="arrow"/>
</svg>
