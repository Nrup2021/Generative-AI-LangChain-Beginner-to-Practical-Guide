<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Document Q and A assistant architecture</title>
  <desc id="desc">PDF or docs are loaded, split, embedded, and stored in a vector database. A Flask API retrieves relevant chunks and passes them to an LLM to produce a grounded answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f6fed"/>
    </marker>
    <style>
      .box { fill: #eef4ff; stroke: #2f6fed; stroke-width: 2; rx: 16; ry: 16; }
      .db { fill: #eafaf1; stroke: #1b9e5a; stroke-width: 2; }
      .llm { fill: #fff3e8; stroke: #f59e0b; stroke-width: 2; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #2f6fed; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="30" y="140" width="140" height="90" class="box"/>
  <text x="100" y="190" text-anchor="middle" class="label">PDF / Docs</text>

  <rect x="210" y="140" width="170" height="90" class="box"/>
  <text x="295" y="185" text-anchor="middle" class="label">Document Loader</text>

  <rect x="420" y="140" width="170" height="90" class="box"/>
  <text x="505" y="185" text-anchor="middle" class="label">Text Splitter</text>

  <rect x="630" y="140" width="170" height="90" class="box"/>
  <text x="715" y="185" text-anchor="middle" class="label">Embeddings</text>

  <rect x="840" y="140" width="170" height="90" class="db"/>
  <text x="925" y="185" text-anchor="middle" class="label">Vector DB</text>

  <rect x="280" y="285" width="160" height="90" class="box"/>
  <text x="360" y="330" text-anchor="middle" class="label">User Question</text>

  <rect x="490" y="285" width="170" height="90" class="box"/>
  <text x="575" y="330" text-anchor="middle" class="label">Flask API</text>

  <rect x="700" y="285" width="160" height="90" class="box"/>
  <text x="780" y="330" text-anchor="middle" class="label">Retriever</text>

  <rect x="900" y="285" width="170" height="90" class="llm"/>
  <text x="985" y="330" text-anchor="middle" class="label">LLM + Prompt</text>

  <rect x="470" y="40" width="250" height="80" class="db"/>
  <text x="595" y="80" text-anchor="middle" class="label">Relevant Chunks</text>

  <rect x="180" y="30" width="240" height="80" class="llm"/>
  <text x="300" y="72" text-anchor="middle" class="label">Grounded Answer</text>

  <path d="M170 185 H210" class="arrow"/>
  <path d="M380 185 H420" class="arrow"/>
  <path d="M590 185 H630" class="arrow"/>
  <path d="M800 185 H840" class="arrow"/>
  <path d="M440 330 H490" class="arrow"/>
  <path d="M660 330 H700" class="arrow"/>
  <path d="M860 330 H900" class="arrow"/>
  <path d="M925 230 V270 H925" class="arrow"/>
  <path d="M780 285 V240 H715 V230" class="arrow"/>
  <path d="M595 120 V80" class="arrow"/>
  <path d="M470 80 H420" class="arrow"/>
  <path d="M180 72 H180 30" class="arrow"/>
</svg>
