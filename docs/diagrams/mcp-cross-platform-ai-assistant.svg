<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">MCP powered cross-platform AI assistant architecture</title>
  <desc id="desc">A shared backend API orchestrates LangChain and MCP tools for mobile, web, and desktop clients. The agent uses vector retrieval and LLM reasoning before returning a unified response.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f6fed"/>
    </marker>
    <style>
      .box { fill: #eef4ff; stroke: #2f6fed; stroke-width: 2; rx: 16; ry: 16; }
      .db { fill: #eafaf1; stroke: #1b9e5a; stroke-width: 2; }
      .llm { fill: #fff3e8; stroke: #f59e0b; stroke-width: 2; }
      .tool { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #2f6fed; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="40" y="255" width="140" height="90" class="box"/>
  <text x="110" y="305" text-anchor="middle" class="label">Mobile App</text>

  <rect x="40" y="120" width="140" height="90" class="box"/>
  <text x="110" y="170" text-anchor="middle" class="label">Web App</text>

  <rect x="40" y="390" width="140" height="90" class="box"/>
  <text x="110" y="440" text-anchor="middle" class="label">Desktop App</text>

  <rect x="250" y="255" width="180" height="90" class="box"/>
  <text x="340" y="305" text-anchor="middle" class="label">Shared Backend API</text>

  <rect x="500" y="255" width="200" height="90" class="box"/>
  <text x="600" y="305" text-anchor="middle" class="label">Auth + Session Layer</text>

  <rect x="760" y="255" width="180" height="90" class="box"/>
  <text x="850" y="305" text-anchor="middle" class="label">LangChain Agent</text>

  <rect x="760" y="120" width="180" height="90" class="tool"/>
  <text x="850" y="170" text-anchor="middle" class="label">MCP Tool Layer</text>

  <rect x="760" y="390" width="180" height="90" class="db"/>
  <text x="850" y="440" text-anchor="middle" class="label">Vector DB</text>

  <rect x="1010" y="255" width="150" height="90" class="llm"/>
  <text x="1085" y="305" text-anchor="middle" class="label">LLM</text>

  <rect x="395" y="70" width="220" height="80" class="box"/>
  <text x="505" y="115" text-anchor="middle" class="label">Unified Response</text>

  <rect x="1010" y="120" width="150" height="90" class="box"/>
  <text x="1085" y="170" text-anchor="middle" class="label">External Tools</text>

  <path d="M180 300 H250" class="arrow"/>
  <path d="M180 165 H210 V300" class="arrow"/>
  <path d="M180 435 H210 V300" class="arrow"/>
  <path d="M430 300 H500" class="arrow"/>
  <path d="M700 300 H760" class="arrow"/>
  <path d="M850 345 V390" class="arrow"/>
  <path d="M850 255 V210" class="arrow"/>
  <path d="M940 300 H1010" class="arrow"/>
  <path d="M1085 255 V210" class="arrow"/>
  <path d="M950 165 H1010" class="arrow"/>
  <path d="M760 165 H600 V255" class="arrow"/>
  <path d="M600 255 V120 H395 V110" class="arrow"/>
  <path d="M395 110 H180 V120" class="arrow"/>
  <path d="M395 110 H380 V255" class="arrow"/>
</svg>
