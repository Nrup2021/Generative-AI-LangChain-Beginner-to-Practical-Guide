<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">AI Mobile Application Backend architecture</title>
  <desc id="desc">A mobile app calls a REST API that includes authentication, a LangChain pipeline, session storage, and an LLM API before returning an AI response.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f6fed"/>
    </marker>
    <style>
      .box { fill: #eef4ff; stroke: #2f6fed; stroke-width: 2; rx: 16; ry: 16; }
      .db { fill: #eafaf1; stroke: #1b9e5a; stroke-width: 2; }
      .llm { fill: #fff3e8; stroke: #f59e0b; stroke-width: 2; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #2f6fed; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="30" y="150" width="150" height="90" class="box"/>
  <text x="105" y="200" text-anchor="middle" class="label">Mobile App</text>

  <rect x="230" y="150" width="170" height="90" class="box"/>
  <text x="315" y="200" text-anchor="middle" class="label">REST API</text>

  <rect x="450" y="150" width="170" height="90" class="box"/>
  <text x="535" y="200" text-anchor="middle" class="label">Auth Layer</text>

  <rect x="670" y="150" width="170" height="90" class="box"/>
  <text x="755" y="200" text-anchor="middle" class="label">LangChain Pipeline</text>

  <rect x="670" y="285" width="170" height="90" class="db"/>
  <text x="755" y="330" text-anchor="middle" class="label">Session DB</text>

  <rect x="850" y="150" width="120" height="90" class="llm"/>
  <text x="910" y="200" text-anchor="middle" class="label">LLM API</text>

  <rect x="350" y="35" width="200" height="80" class="box"/>
  <text x="450" y="80" text-anchor="middle" class="label">AI Response</text>

  <path d="M180 195 H230" class="arrow"/>
  <path d="M400 195 H450" class="arrow"/>
  <path d="M620 195 H670" class="arrow"/>
  <path d="M840 195 H850" class="arrow"/>
  <path d="M755 240 V285" class="arrow"/>
  <path d="M910 240 V300 H840" class="arrow"/>
  <path d="M350 75 H180 V140" class="arrow"/>
  <path d="M550 150 V100 H450 V115" class="arrow"/>
</svg>
